version: "3.8"

# テスト専用のDocker Compose設定
# 使用方法: docker compose -f docker-compose.test.yml up -d

services:
  test-db:
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5433:5432" # 本番と被らないようにポートを変更
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      # データは永続化しない（テスト毎にクリーンな状態）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # メモリ上で高速化
